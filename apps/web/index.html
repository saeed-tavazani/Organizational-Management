  <script>
    if (window.location.hostname === 'demo.kaneo.app') {

      script.src = 'https://plausible.kaneo.app/js/script.js';

      window.plausible = window.plausible || function () {
        (window.plausible.q = window.plausible.q || []).push(arguments);
      };
